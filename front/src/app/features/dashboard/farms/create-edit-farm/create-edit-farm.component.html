<div class="max-w-4xl mx-auto bg-white p-6 rounded-lg shadow-md">
    <h2 class="text-2xl font-bold mb-4">Agregar Finca</h2>
    <form [formGroup]="farmForm" (ngSubmit)="onSubmit()">
        <!-- Name -->
        <div class="mb-4">
            <label for="name" class="block text-sm font-medium text-gray-700">Nombre</label>
            <input
                type="text"
                id="name"
                name="name"
                formControlName="name"
                class="w-full px-4 py-2 mt-1 text-gray-700 bg-gray-100 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
            />
        </div>
        <!-- Location -->
        <div class="mb-4">
            <label for="location" class="block text-sm font-medium text-gray-700">Ubicación</label>
            <input
                type="text"
                id="location"
                name="location"
                formControlName="location"
                class="w-full px-4 py-2 mt-1 text-gray-700 bg-gray-100 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
            />
        </div>

        <!-- Size -->
        <div class="mb-4">
            <label for="size" class="block text-sm font-medium text-gray-700">Tamaño (en m2)</label>
            <input
                type="number"
                id="size"
                name="size"
                formControlName="size"
                class="w-full px-4 py-2 mt-1 text-gray-700 bg-gray-100 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
            />
        </div>
        <!-- Sectors -->
        <div formArrayName="sectors" class="mb-6">
            <h3 class="text-lg font-semibold mb-2">Sectores</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div *ngFor="let sector of sectors.controls; let i = index" [formGroupName]="i" class="p-4 border border-gray-300 rounded-md bg-gray-50">
                    <div class="mb-2">
                        <label for="sector-name-{{ i }}" class="block text-sm font-medium text-gray-700">Nombre del sector:</label>
                        <input
                            id="sector-name-{{ i }}"
                            formControlName="name"
                            type="text"
                            class="w-full px-4 py-2 mt-1 text-gray-700 bg-white border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                        />
                    </div>

                    <div class="mb-2">
                        <label for="sector-size-{{ i }}" class="block text-sm font-medium text-gray-700">Tamaño del sector:</label>
                        <input
                            id="sector-size-{{ i }}"
                            formControlName="size"
                            type="number"
                            class="w-full px-4 py-2 mt-1 text-gray-700 bg-white border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                        />
                    </div>

                    <button
                        type="button"
                        (click)="removeSector(i)"
                        class="text-red-600 hover:text-red-800 text-sm font-medium mt-2"
                    >
                        Eliminar sector
                    </button>
                </div>
            </div>

            <button
                type="button"
                (click)="addSector()"
                class="bg-green-600 text-white py-2 px-4 rounded-md hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-green-500 focus:ring-offset-2 mt-4"
            >
                Agregar sector
            </button>
        </div>
        <!-- Submit Button -->
        <div>
            <button
                type="submit"
                class="w-full bg-blue-600 text-white py-2 px-4 rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500
                focus:ring-offset-2 disabled:opacity-50 disabled:cursor-not-allowed"
                [disabled]="farmForm.invalid || loading()"
            >
                Guardar Finca
            </button>
        </div>
    </form>
</div>
