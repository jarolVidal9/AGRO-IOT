@if(loading()){
    <div class="flex items-center justify-center h-screen">
        <div class="w-16 h-16 border-4 border-t-transparent border-blue-500 rounded-full animate-spin"></div>
    </div>
}@else{
    <div class="flex justify-end p-4">
        <button class="bg-green-500 text-white px-4 py-2 rounded-lg shadow hover:bg-green-600 transition duration-200"
            routerLink = "/farms/create">
            Añadir Finca
        </button>
    </div>
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8 p-8">
        @for (farm of farms; track farm.id) {
            <div class="bg-white shadow-md rounded-lg overflow-hidden hover:shadow-lg transition-shadow duration-300">
                <div class="p-4">
                    <h2 class="text-xl font-semibold text-gray-800 mb-2">{{farm.name}}</h2>
                    <p class="text-sm text-gray-600 mb-1"><strong>Ubicación:</strong> {{farm.location}}</p>
                    <p class="text-sm text-gray-600 mb-1"><strong>Dueño:</strong> {{farm.owner}}</p>
                    <p class="text-sm text-gray-600 mb-1"><strong>Dimensiones:</strong> {{farm.size}} m<sup>2</sup></p>
                    <p class="text-sm text-gray-600"><strong>Sectores:</strong> {{farm.sectors?.length || 0}}</p>
                </div>
                <div class="bg-gray-50 py-2 flex justify-around items-center px-4">
                    <button class="px-3 py-1 text-sm font-medium border border-blue-500 text-blue-500 rounded-lg hover:bg-blue-500 hover:text-white transition duration-200" 
                    [routerLink]="['/farms/detail', farm.id]">Detalles</button>
                    <button class="px-3 py-1 text-sm font-medium border border-yellow-500 text-yellow-500 rounded-lg hover:bg-yellow-500 hover:text-white transition duration-200" 
                    [routerLink]="['/farms/create', farm.id]">Editar</button>
                    <button class="px-3 py-1 text-sm font-medium border border-red-500 text-red-500 rounded-lg hover:bg-red-500 hover:text-white transition duration-200"
                    (click)="deleteFarm(farm.id)">Eliminar</button>
                </div>
            </div>
        }
    </div>

}
